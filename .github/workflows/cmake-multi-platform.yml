name: Build Qt

on: [push, pull_request]

permissions:
  contents: read

env:
  QT_VERSION: '6.8.3'
  APP_NAME: NiProject

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            qt_host: windows
            qt_arch: win64_msvc2022_64
            build_dir: build/Release
          - platform: macos
            os: macos-latest
            qt_host: mac
            qt_arch: clang_64
            build_dir: build
          - platform: linux
            os: ubuntu-22.04
            qt_host: linux
            qt_arch: gcc_64
            build_dir: build

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ---------- 工具 ----------
      - name: 安装 Ninja (Windows)
        if: matrix.platform == 'windows'
        run: choco install ninja -y

      - name: 安装 Ninja (macOS)
        if: matrix.platform == 'macos'
        run: brew install ninja

      - name: 系统依赖 (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libopengl-dev libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-cursor0 libxcb-shape0 \
            libxcb-randr0 libxcb-xkb1 libegl1

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'windows'

      # ---------- 装 Qt（aqtinstall，无需登录） ----------
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装 aqtinstall
        run: python -m pip install aqtinstall==3.1.0

      - name: 安装 Qt
        id: qt
        uses: actions/cache@v4
        with:
          path: qt
          key: qt-${{ env.QT_VERSION }}-${{ matrix.qt_arch }}-v1

      - name: 下载 Qt
        if: steps.qt.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p qt
          python -m aqt install-qt ${{ matrix.qt_host }} desktop ${{ env.QT_VERSION }} \
            ${{ matrix.qt_arch }} \
            --outputdir qt \
            --archives qtbase qttools qtshadertools
          echo "QTDIR=${{ github.workspace }}/qt/${{ env.QT_VERSION }}/${{ matrix.qt_arch }}" >> "$GITHUB_ENV"

      - name: 设置 QTDIR（命中缓存时）
        if: steps.qt.outputs.cache-hit == 'true'
        shell: bash
        run: |
          echo "QTDIR=${{ github.workspace }}/qt/${{ env.QT_VERSION }}/${{ matrix.qt_arch }}" >> "$GITHUB_ENV"

      - name: 查看 Qt 版本
        shell: bash
        run: |
          "$QTDIR/bin/qmake" -version

      # ---------- 配置（qmake） ----------
      - name: 配置
        shell: bash
        run: |
          set -e
          mkdir -p build
          # 显式指定 .pro，避免目录里有多个 pro 时选错
          "$QTDIR/bin/qmake" "${{ github.workspace }}/NiProject.pro" -o build \
            CONFIG+=release CONFIG+=c++17

      # ---------- 编译 ----------
      - name: 编译
        shell: bash
        run: |
          set -e
          cmake --build build --config Release --target all

      # ---------- 打包 macOS ----------
      - name: 打包 macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -e
          APP="${{ env.build_dir }}/${{ env.APP_NAME }}.app"
          if [ ! -d "$APP" ]; then echo "ERROR: $APP not found"; ls -R build; exit 1; fi
          "$(dirname "$QTDIR/bin/qmake")/macdeployqt" "$APP" -verbose=2
          find "$APP/Contents/Frameworks" -name Headers -exec rm -rf {} + 2>/dev/null || true
          find "$APP/Contents/Frameworks" -name "*.prl" -delete 2>/dev/null || true
          hdiutil create -volname "${{ env.APP_NAME }}" -srcfolder "$APP" -ov -format UDZO "${{ env.APP_NAME }}.dmg"

      # ---------- 打包 Windows ----------
      - name: 打包 Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $app = "${{ env.build_dir }}\${{ env.APP_NAME }}.exe"
          if (-not (Test-Path $app)) { Get-ChildItem build -Recurse -Filter *.exe; throw "$app not found" }
          & "$env:QTDIR\bin\windeployqt.exe" --release $app
          Compress-Archive "${{ env.build_dir }}\*" -DestinationPath "${{ env.APP_NAME }}-Windows.zip" -Force

      # ---------- 上传产物 ----------
      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            *.dmg
            *-Windows.zip
          if-no-files-found: ignore
